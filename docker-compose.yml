services:
  # --- Backend Laravel ---
  api:
    build:
      context: ./backend/vendor/laravel/sail/runtimes/8.5
      dockerfile: Dockerfile
      args:
        WWWGROUP: ${WWWGROUP:-1000}
    container_name: backend
    image: 'sail-8.5/app'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - "8000:80"
    environment:
      WWWUSER: ${WWWUSER:-1000}
      LARAVEL_SAIL: 1
    volumes:
      - './backend:/var/www/html'
    networks:
      - food-network
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file:
      - ./backend/.env

  # --- Bancos e Serviços ---
  db:
    image: 'postgres:15'
    container_name: food-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: food_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
    volumes:
      - food-postgres:/var/lib/postgresql/data
    networks:
      - food-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d food_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    container_name: food-redis
    image: redis:alpine
    networks:
      - food-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      retries: 3
      timeout: 5s
    volumes:
      - redis_data:/data

  mailpit:
    image: 'axllent/mailpit:latest'
    container_name: food-mailpit
    ports:
      - "8025:8025"
    networks:
      - food-network

  # --- Frontends ---
  # Admin (lojista + super admin): http://localhost:5175
  # Cardápio do cliente:            http://localhost:5174
  # API Laravel:                    http://localhost:8000
  admin-dashboard:
    image: food-admin-image:latest
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile.dev
    container_name: food-admin
    volumes:
      - ./admin-dashboard:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "80"]
    ports:
      - "5175:80"
    networks:
      - food-network
    depends_on:
      - api

  customer-app:
    image: food-customer-image:latest
    build:
      context: ./customer-app
      dockerfile: Dockerfile
    container_name: food-customer
    volumes:
      - ./customer-app:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "80"]
    ports:
      - "5174:80"
    networks:
      - food-network
    depends_on:
      - api

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: food-tunnel
    profiles:
      - tunnel
    command: tunnel --no-autoupdate --url http://api:80
    networks:
      - food-network
    depends_on:
      - api

  scheduler:
    image: 'sail-8.5/app'
    container_name: food-scheduler
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      WWWUSER: ${WWWUSER:-1000}
      LARAVEL_SAIL: 1
    volumes:
      - './backend:/var/www/html'
    networks:
      - food-network
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file:
      - ./backend/.env
    command: ["php", "artisan", "schedule:work"]

  evolution-postgres:
    image: postgres:15
    container_name: food-evolution-postgres
    profiles:
      - evolution
    environment:
      POSTGRES_DB: evolution_api
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_POSTGRES_PASSWORD:-evolution123}
    volumes:
      - evolution-postgres:/var/lib/postgresql/data
    networks:
      - food-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution_api"]
      interval: 5s
      timeout: 5s
      retries: 10

  evolution_api:
    image: atendai/evolution-api:v2.2.3
    container_name: food-evolution
    profiles:
      - evolution
    ports:
      - "8080:8080"
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://localhost:8080}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-change-me}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_POSTGRES_PASSWORD:-evolution123}@evolution-postgres:5432/evolution_api?schema=public
      REDIS_ENABLED: "true"
      REDIS_URI: redis://redis:6379
      LOG_LEVEL: ERROR
    networks:
      - food-network
    depends_on:
      evolution-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  food-network:
    driver: bridge

volumes:
  food-postgres:
  redis_data:
  evolution-postgres: