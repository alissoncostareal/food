server {
    listen 80;
    server_name localhost admin.partiumenu.com.br;

    root /usr/share/nginx/html;
    index index.html;

    # Assets com hash no nome podem ser cacheados com segurança
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA (Vue Router history mode): qualquer rota desconhecida → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
