apiVersion: v1
kind: Secret
metadata:
  name: partiumenu-secrets
  namespace: partiumenu
type: Opaque
stringData:
  APP_KEY: "base64:YOUR_APP_KEY_HERE"
  DATABASE_URL: "postgresql://user:password@host:5432/dbname"
  DB_HOST: "your-db-host"
  DB_DATABASE: "partiumenu_prod"
  DB_USERNAME: "partiumenu_prod_user"
  DB_PASSWORD: "your-secure-password"

  # Cloudflare R2 / S3
  AWS_ACCESS_KEY_ID: "your-access-key-id"
  AWS_SECRET_ACCESS_KEY: "your-secret-access-key"
  AWS_BUCKET: "partiumenu-media"
  AWS_ENDPOINT: "https://your-account-id.r2.cloudflarestorage.com"
  AWS_URL: "https://pub-your-id.r2.dev"

  # AI Keys
  GEMINI_API_KEY: "your-gemini-api-key"
  OPENAI_API_KEY: "your-openai-api-key"

  # Evolution API
  EVOLUTION_API_KEY: "your-evolution-api-key"
  EVOLUTION_WEBHOOK_SECRET: "your-webhook-secret"

  # Pagar.me
  PAGARME_PUBLIC_KEY: "pk_your_key"
  PAGARME_SECRET_KEY: "sk_your_key"
  PAGARME_WEBHOOK_SECRET: "your-webhook-secret"

  # iFood
  IFOOD_CENTRALIZED_CLIENT_ID: "your-ifood-client-id"
  IFOOD_CENTRALIZED_CLIENT_SECRET: "your-ifood-client-secret"

  # Kafka (se usar SASL_SSL / Upstash / Confluent)
  KAFKA_USERNAME: ""
  KAFKA_PASSWORD: ""
