apiVersion: apps/v1
kind: Deployment
metadata:
  name: partiumenu-api
  namespace: partiumenu
  labels:
    app.kubernetes.io/name: partiumenu-api
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: partiumenu-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: partiumenu-api
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: api
          image: partiumenu-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: partiumenu-config
            - secretRef:
                name: partiumenu-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: partiumenu-api-service
  namespace: partiumenu
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: partiumenu-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: partiumenu-api-hpa
  namespace: partiumenu
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: partiumenu-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
