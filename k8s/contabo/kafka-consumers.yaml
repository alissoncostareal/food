apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-whatsapp-inbound
  namespace: partiumenu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-whatsapp-inbound
  template:
    metadata:
      labels:
        app: kafka-whatsapp-inbound
    spec:
      containers:
        - name: consumer
          image: docker.io/library/partiumenu-api:latest
          imagePullPolicy: IfNotPresent
          command: ["/var/www/html/docker/kafka-worker.sh"]
          envFrom:
            - configMapRef:
                name: partiumenu-config
            - secretRef:
                name: partiumenu-secrets
          env:
            - name: KAFKA_TOPICS
              value: whatsapp.inbound.messages
            - name: KAFKA_CONSUMER_CLASS
              value: App\Kafka\Consumers\WhatsappInboundKafkaHandler
            - name: KAFKA_CONSUMER_GROUP_ID
              value: partiumenu-whatsapp-inbound
          resources:
            requests:
              cpu: 50m
              memory: 160Mi
            limits:
              cpu: 500m
              memory: 384Mi
---
