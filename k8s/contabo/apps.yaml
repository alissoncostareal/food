apiVersion: apps/v1
kind: Deployment
metadata:
  name: partiumenu-api
  namespace: partiumenu
  labels:
    app: partiumenu-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: partiumenu-api
  template:
    metadata:
      labels:
        app: partiumenu-api
    spec:
      containers:
        - name: api
          image: docker.io/library/partiumenu-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: partiumenu-config
            - secretRef:
                name: partiumenu-secrets
          readinessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 25
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: partiumenu-api-service
  namespace: partiumenu
spec:
  selector:
    app: partiumenu-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: partiumenu-worker
  namespace: partiumenu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: partiumenu-worker
  template:
    metadata:
      labels:
        app: partiumenu-worker
    spec:
      containers:
        - name: worker
          image: docker.io/library/partiumenu-api:latest
          imagePullPolicy: IfNotPresent
          command: ["/var/www/html/docker/worker.sh"]
          envFrom:
            - configMapRef:
                name: partiumenu-config
            - secretRef:
                name: partiumenu-secrets
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: partiumenu-scheduler
  namespace: partiumenu
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: scheduler
              image: docker.io/library/partiumenu-api:latest
              imagePullPolicy: IfNotPresent
              command: ["/var/www/html/docker/scheduler.sh"]
              envFrom:
                - configMapRef:
                    name: partiumenu-config
                - secretRef:
                    name: partiumenu-secrets
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 384Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: partiumenu-admin
  namespace: partiumenu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: partiumenu-admin
  template:
    metadata:
      labels:
        app: partiumenu-admin
    spec:
      containers:
        - name: admin
          image: docker.io/library/partiumenu-admin:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: partiumenu-admin
  namespace: partiumenu
spec:
  selector:
    app: partiumenu-admin
  ports:
    - port: 80
      targetPort: http
