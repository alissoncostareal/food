apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: partiumenu
  namespace: partiumenu
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - partiumenu.com.br
        - www.partiumenu.com.br
        - admin.partiumenu.com.br
        - app.partiumenu.com.br
        - api.partiumenu.com.br
      secretName: partiumenu-tls
  rules:
    - host: partiumenu.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: partiumenu-landing
                port:
                  number: 80
    - host: www.partiumenu.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: partiumenu-landing
                port:
                  number: 80
    - host: admin.partiumenu.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: partiumenu-admin
                port:
                  number: 80
    - host: app.partiumenu.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: partiumenu-customer
                port:
                  number: 80
    - host: api.partiumenu.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: partiumenu-api-service
                port:
                  number: 80
    - host: api.173.212.242.9.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: partiumenu-api-service
                port:
                  number: 80
    - host: admin.173.212.242.9.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: partiumenu-admin
                port:
                  number: 80
    - host: app.173.212.242.9.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: partiumenu-customer
                port:
                  number: 80
    - host: landing.173.212.242.9.sslip.io
      http:
        paths:
          - path: /
