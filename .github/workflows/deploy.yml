# Deploy automático na VPS K3s
# Disparado após conclusão com sucesso do CI no branch main.
#
# GitHub → Settings → Environments → production → Secret:
#   VPS_SSH_KEY — chave privada para acesso como root em 173.212.242.9

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy production (VPS)
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy on VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${VPS_SSH_KEY:-}" ]; then
            echo "::error::Secret VPS_SSH_KEY ausente no environment production."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 173.212.242.9 >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes root@173.212.242.9 /root/platform/deploy.sh
