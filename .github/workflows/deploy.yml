name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches:
      - staging
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy staging
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'staging'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        env:
          IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/partiumenu
          IMAGE_TAG: staging-${{ github.event.workflow_run.head_sha }}
        run: |
          docker build -t "$IMAGE_PREFIX-api:$IMAGE_TAG" -t "$IMAGE_PREFIX-api:staging" ./backend
          docker build -t "$IMAGE_PREFIX-admin:$IMAGE_TAG" -t "$IMAGE_PREFIX-admin:staging" \
            --build-arg VITE_API_URL="${{ vars.VITE_API_URL }}" ./admin-dashboard
          docker push "$IMAGE_PREFIX-api:$IMAGE_TAG"
          docker push "$IMAGE_PREFIX-api:staging"
          docker push "$IMAGE_PREFIX-admin:$IMAGE_TAG"
          docker push "$IMAGE_PREFIX-admin:staging"

      - name: Deploy on server (SSH)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin staging
            git checkout staging
            git pull origin staging
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            docker image prune -f

  deploy-production:
    name: Deploy production
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        env:
          IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/partiumenu
          IMAGE_TAG: prod-${{ github.event.workflow_run.head_sha }}
        run: |
          docker build -t "$IMAGE_PREFIX-api:$IMAGE_TAG" -t "$IMAGE_PREFIX-api:latest" ./backend
          docker build -t "$IMAGE_PREFIX-admin:$IMAGE_TAG" -t "$IMAGE_PREFIX-admin:latest" \
            --build-arg VITE_API_URL="${{ vars.VITE_API_URL }}" ./admin-dashboard
          docker push "$IMAGE_PREFIX-api:$IMAGE_TAG"
          docker push "$IMAGE_PREFIX-api:latest"
          docker push "$IMAGE_PREFIX-admin:$IMAGE_TAG"
          docker push "$IMAGE_PREFIX-admin:latest"

      - name: Deploy on server (SSH)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin main
            git checkout main
            git pull origin main
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            docker image prune -f
